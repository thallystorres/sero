name: api_sero
services:
  db:
    image: postgres:18.6-trixie
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?defina no .env}:5432"

  redis:
    image: redis:8.10-alpine
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres_data:
  redis_data:
