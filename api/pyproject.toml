[project]
name = "sero"
version = "0.1.0"
authors = [
    { name = "Thallys Torres", email = "thallys.auugusto.torres@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.fastapi]
entrypoint = "sero.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"